<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Devin Gill — QA Automation Engineer and bassist for always other, based in Virginia.">
  <meta name="author" content="Devin Gill">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Devin Gill — QA Automation Engineer">
  <meta property="og:description" content="Breaking things on purpose so users don't. QA Automation · Playwright/Python · Bassist.">

  <title>Devin Gill</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #00ff9f;
      --dim:    #00c97a;
      --dark:   #001a0d;
      --panel:  rgba(0, 255, 159, 0.06);
      --border: rgba(0, 255, 159, 0.18);
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      cursor: none;
    }

    /* Animated noise / scanline background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 159, 0.03) 2px,
        rgba(0, 255, 159, 0.03) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.65) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Custom block cursor */
    #cursor {
      position: fixed;
      width: 12px;
      height: 18px;
      background: var(--green);
      opacity: 0.85;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      animation: blink-cursor 1s step-end infinite;
    }

    @keyframes blink-cursor {
      50% { opacity: 0; }
    }

    /* HUD overlays */
    .hud {
      position: fixed;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      z-index: 10;
    }

    #hud-status  { top: 1.1rem; left: 1.4rem; }
    #hud-clock   { top: 1.1rem; right: 1.4rem; }
    #hud-build   { bottom: 1.1rem; left: 1.4rem; }
    #hud-mode    { bottom: 1.1rem; right: 1.4rem; }

    .hud-label {
      display: inline-block;
      border: 1px solid var(--border);
      padding: 2px 8px;
      background: var(--panel);
    }

    /* Blinking status dot */
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: blink-cursor 1.4s step-end infinite;
    }

    /* Main content */
    main {
      position: relative;
      z-index: 5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 8vw;
      max-width: 820px;
    }

    .prompt {
      font-size: 0.75rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--green);
      text-shadow: 0 0 18px rgba(0, 255, 159, 0.35);
    }

    .subtitle {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: #c8fde7;
      border-left: 2px solid var(--green);
      padding-left: 0.85rem;
      line-height: 1.5;
    }

    .links {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.4rem;
    }

    .links a {
      color: var(--green);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      border: 1px solid var(--border);
      padding: 4px 12px;
      transition: background 0.15s, color 0.15s;
    }

    .links a:hover {
      background: var(--green);
      color: var(--dark);
    }

    .rainbow-link {
      background: linear-gradient(-45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 4s ease infinite;
      font-weight: bold;
      border: none;
      padding: 0;
    }

    .rainbow-link:hover {
      background: linear-gradient(-45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation-duration: 1.5s;
    }

    @keyframes rainbow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Fade-in on subtitle line */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .type {
      animation: fade-in 0.8s ease 0.4s both;
    }
  </style>
</head>
<body>

  <div id="cursor" aria-hidden="true"></div>

  <!-- HUD overlays -->
  <div class="hud" id="hud-status">
    <span class="hud-label"><span class="dot"></span>ONLINE</span>
  </div>

  <div class="hud" id="hud-clock">
    <span class="hud-label" id="clock">--:--:-- --</span>
  </div>

  <div class="hud" id="hud-build">
    <span class="hud-label">BUILD 2025.1 · QA</span>
  </div>

  <div class="hud" id="hud-mode">
    <span class="hud-label">MODE: BREAK</span>
  </div>

  <main id="main-content">
    <p class="prompt">~/devin-gill $</p>

    <h1>Devin Gill</h1>

    <p class="subtitle type">QA Automation Engineer &nbsp;·&nbsp; Certified Scrum Product Owner</p>

    <p class="tagline">
      Breaking things on purpose so users don't.<br>
      Bassist for <a href="https://linktr.ee/alwaysother" target="_blank" rel="noopener" class="rainbow-link">always other</a>.
    </p>

    <nav class="links" aria-label="External links">
      <a href="https://github.com/invisible-ray" target="_blank" rel="noopener">[ GitHub ]</a>
      <a href="https://www.linkedin.com/in/devingill/" target="_blank" rel="noopener">[ LinkedIn ]</a>
      <a href="mailto:devin.gill@outlook.com">[ Email ]</a>
      <a href="portfolio.html">[ Portfolio ]</a>
      <a href="#" aria-label="Download resume (coming soon)">[ Resume ]</a>
    </nav>
  </main>

  <script>
    // Block cursor follows mouse
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    // Live 12-hour clock
    const clockEl = document.getElementById('clock');
    function updateClock() {
      const now  = new Date();
      let   hrs  = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = (hrs % 12) || 12;
      const h = hrs.toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      clockEl.textContent = `${h}:${m}:${s} ${ampm}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
